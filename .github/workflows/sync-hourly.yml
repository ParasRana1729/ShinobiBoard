name: Hourly LeetCode Sync

on:
  schedule:
    # Run every hour at minute 0 (Free on GitHub Actions)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ShinobiBoard hourly sync
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Secrets APP_URL or CRON_SECRET not configured yet. Skipping."
            exit 0
          fi
          curl -f -s -X GET "${{ secrets.APP_URL }}/api/cron/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
